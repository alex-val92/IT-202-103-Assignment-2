<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Palindrome Checker </h1>
        <p>A palindrome is read the same forwards and backwards [example: yay, mom, racecar]</p>
        <h2>Enter a series of numbers or a word to check if it's a palindrome!</h2>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Enter Numbers or word here">
            <button id="check-button">Check</button>

            <div class="result-area">
                <p id="result"></p>
                <div id="resultOutput" class="output"></div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
