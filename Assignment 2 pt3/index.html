<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tip Calculator </h1>
        <p>Enter your bill's subtotal and desired tip percentage to calculate the total amount.</p>
        
        <div class="input-section">
            <label for="subtotal">Bill Subtotal ($):</label>
            <input type="number" id="subtotal" placeholder="0.00" min="0" step="0.01">

            <label for="tipPercentage">Tip Percentage (%):</label>
            <input type="number" id="tipPercentage" placeholder="15" min="0" step="1" max="100">
            
            <button id="calculateButton">Calculate Total</button>
        </div>
        
        <div class="result">
            <p id="totalAmount">Total Amount: $0.00</p>
            <p id="tipAmount">Tip Amount: $0.00</p>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
